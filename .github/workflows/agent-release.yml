name: Build & Release Agent

on:
  push:
    tags:
      - "agent/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v0.2.0)"
        required: true
        default: "v0.1.0"

jobs:
  build:
    name: Build agent binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/agent/go.sum

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # tag is agent/v0.1.0 → strip prefix
            echo "version=${GITHUB_REF_NAME#agent/}" >> $GITHUB_OUTPUT
          fi

      - name: Build
        working-directory: apps/agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o filin-agent-${{ matrix.suffix }} \
            ./cmd/agent

      - name: Compute checksums
        working-directory: apps/agent
        run: |
          sha256sum filin-agent-${{ matrix.suffix }} > filin-agent-${{ matrix.suffix }}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filin-agent-${{ matrix.suffix }}
          path: |
            apps/agent/filin-agent-${{ matrix.suffix }}
            apps/agent/filin-agent-${{ matrix.suffix }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=agent/${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#agent/}" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Agent ${{ steps.version.outputs.version }}"
          body: |
            ## FilinControl Agent ${{ steps.version.outputs.version }}

            ### Install
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-agent.sh | sudo bash -s -- \
              --master-url "https://panel.example.com" \
              --enroll-token "fna_enroll_..."
            ```

            ### Manual download
            | Platform | Binary |
            |----------|--------|
            | Linux x86_64 | [filin-agent-linux-amd64](filin-agent-linux-amd64) |
            | Linux arm64  | [filin-agent-linux-arm64](filin-agent-linux-arm64) |

          files: |
            dist/filin-agent-linux-amd64
            dist/filin-agent-linux-amd64.sha256
            dist/filin-agent-linux-arm64
            dist/filin-agent-linux-arm64.sha256
          draft: false
          prerelease: false
