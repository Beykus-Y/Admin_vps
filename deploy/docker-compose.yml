services:
  api:
    build:
      context: ../apps/master-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://filin:filin@postgres:5432/filin
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      AGENT_AUTO_UPDATE_ENABLED: ${AGENT_AUTO_UPDATE_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
      SUB_PROXY_BASE_URL: ${SUB_PROXY_BASE_URL:-}
      SUB_PROXY_HMAC_SECRET: ${SUB_PROXY_HMAC_SECRET:-}
      SUB_PROXY_TIMEOUT_SECONDS: ${SUB_PROXY_TIMEOUT_SECONDS:-10}
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks:
      - internal

  web:
    build:
      context: ../apps/web-panel
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      - api
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filin
      POSTGRES_PASSWORD: filin
      POSTGRES_DB: filin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filin -d filin"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - internal

  migrate:
    build:
      context: ../apps/master-api
    profiles:
      - tools
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://filin:filin@postgres:5432/filin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: no

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
